name: Validate Pull Request

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      PUBLIC_NEWSLETTER_ENABLED: ${{ vars.PUBLIC_NEWSLETTER_ENABLED }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify public Supabase build config
        shell: bash
        run: |
          test -n "$PUBLIC_SUPABASE_URL" || { echo "PUBLIC_SUPABASE_URL is missing"; exit 1; }
          test -n "$PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo "PUBLIC_SUPABASE_PUBLISHABLE_KEY is missing"; exit 1; }
          case "$PUBLIC_SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "PUBLIC_SUPABASE_URL has an unexpected format"; exit 1 ;;
          esac
          case "$PUBLIC_SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) ;;
            *) echo "PUBLIC_SUPABASE_PUBLISHABLE_KEY is not a publishable key"; exit 1 ;;
          esac

      - name: Verify newsletter flow
        run: node --test tests/newsletter.test.mjs

      - name: Build and type-check Astro site
        run: npm run build

      - name: Verify generated pages and CSS assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          dist = Path("dist")
          pages = list(dist.rglob("*.html"))
          if not pages:
              sys.exit("No generated HTML pages found")

          missing = []
          css_links = 0
          for page in pages:
              html = page.read_text(encoding="utf-8")
              for href in re.findall(r'href=["\']([^"\']+\.css(?:\?[^"\']*)?)["\']', html):
                  css_links += 1
                  clean = href.split("?", 1)[0]
                  asset = dist / clean.lstrip("/") if clean.startswith("/") else page.parent / clean
                  if not asset.exists() or asset.stat().st_size == 0:
                      missing.append(f"{page}: {href}")

          if css_links == 0:
              sys.exit("No CSS references found in generated HTML")
          if missing:
              print("\n".join(missing))
              sys.exit(f"{len(missing)} generated CSS asset reference(s) are missing")

          print(f"Verified {len(pages)} HTML pages and {css_links} CSS references.")
          PY
