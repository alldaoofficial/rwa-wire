name: RWA Wire Candidate Generator

on:
  push:
    paths:
      - "publish/inbox/*.json"
  workflow_dispatch:
    inputs:
      brief_path:
        description: "Reviewed story brief JSON path (publish/inbox/*.json)"
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: rwa-wire-candidate-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      # Routing imports Python modules after cleanup and must keep git clean.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Resolve story brief
        env:
          MANUAL_BRIEF_PATH: ${{ inputs.brief_path }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then BRIEF_PATH="$MANUAL_BRIEF_PATH"; else BRIEF_PATH=$(git diff --name-only --diff-filter=AM HEAD^ HEAD -- "publish/inbox/*.json"); fi
          COUNT=$(printf "%s\n" "$BRIEF_PATH" | sed '/^$/d' | wc -l)
          if [ "$COUNT" -ne 1 ]; then echo "Expected exactly one new story brief, found $COUNT."; exit 1; fi
          case "$BRIEF_PATH" in publish/inbox/*.json) ;; *) echo "Invalid brief path"; exit 1;; esac
          echo "BRIEF_PATH=$BRIEF_PATH" >> "$GITHUB_ENV"
      - name: Check content before creating public files
        id: quality
        run: python3 scripts/news_quality.py "$BRIEF_PATH" --github-output
      - name: Generate article, visual and candidate
        if: steps.quality.outputs.eligible == 'true'
        run: python3 scripts/candidate_generator.py "$BRIEF_PATH"
      - name: Build site
        if: steps.quality.outputs.eligible == 'true'
        run: |
          npm install
          npm run build
      - name: Commit generated story package
        if: steps.quality.outputs.eligible == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage only the story package; builds modify tracked artifacts.
          git add -- src/content/articles/ public/images/news/ publish/candidates/
          git diff --cached --quiet && { echo "Nothing generated"; exit 1; }
          git commit -m "Generate RWA Wire story candidate"
          # Discard only disposable build/dependency output in this clean CI checkout.
          python3 - <<'PY'
          import subprocess
          prefixes = ("dist/", ".astro/", "node_modules/", "scripts/__pycache__/")
          names = subprocess.check_output(["git", "diff", "--name-only", "-z"]).decode().split("\0")
          generated = [name for name in names if name.startswith(prefixes) or name in {"public/sitemap.xml", "package-lock.json"}]
          if generated:
              subprocess.run(["git", "restore", "--worktree", "--", *generated], check=True)
          subprocess.run(["git", "clean", "-fd", "--", "dist/", ".astro/", "node_modules/", "scripts/__pycache__/"], check=True)
          PY
          for attempt in 1 2 3; do git pull --rebase origin main && git push && break; if [ "$attempt" -eq 3 ]; then exit 1; fi; sleep 3; done
      - name: Deploy generated article
        if: steps.quality.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
      - name: Route generated candidate
        if: steps.quality.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CANDIDATE_PATH=$(git diff-tree --no-commit-id --name-only -r HEAD -- "publish/candidates/*.json" | head -n 1)
          if [ -z "$CANDIDATE_PATH" ]; then echo "No candidate manifest found in generated commit."; exit 1; fi
          if APPROVED_PATH=$(python3 scripts/verified_autopublish.py "$BRIEF_PATH" "$CANDIDATE_PATH"); then
            if [ -z "$APPROVED_PATH" ]; then
              echo "This reviewed package is already posted."
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$APPROVED_PATH"
            git diff --cached --quiet || git commit -m "Auto-approve source-reviewed RWA Wire candidate"
            git pull --rebase origin main
            git push
            gh workflow run telegram-test.yml --ref main -f manifest_path="$APPROVED_PATH"
          else
            gh workflow run editorial-approval.yml --ref main -f candidate_path="$CANDIDATE_PATH"
          fi
