name: RWA Wire Evergreen Social

on:
  workflow_dispatch:
  schedule:
    - cron: '30 14 * * *'

permissions:
  contents: write

concurrency:
  group: rwa-wire-evergreen-social
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install social image dependencies
        run: python3 -m pip install --disable-pip-version-check pillow cairosvg
      - name: Generate one evergreen social package
        id: generate
        run: |
          set +e
          OUTPUT=$(python3 scripts/evergreen_social.py 2>&1)
          CODE=$?
          set -e
          echo "$OUTPUT"
          if [ $CODE -ne 0 ]; then
            if echo "$OUTPUT" | grep -q 'nothing to publish'; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit $CODE
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "package=$OUTPUT" >> "$GITHUB_OUTPUT"
      - name: Publish to X
        if: steps.generate.outputs.skip != 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          PACKAGE: ${{ steps.generate.outputs.package }}
        run: python3 scripts/x_publish.py "$PACKAGE"
      - name: Publish to Telegram
        if: steps.generate.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '@RWAWireHQ'
          PACKAGE: ${{ steps.generate.outputs.package }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,urllib.parse,urllib.request
          p=pathlib.Path(os.environ['PACKAGE']); d=json.loads(p.read_text()); text=d['telegram']; pid=d['id']
          marker=pathlib.Path('publish/evergreen-social-posted')/(pid+'.json')
          # The persisted marker is authoritative. If Telegram already succeeded in a
          # previous attempt, do not send it again; allow the workflow to continue.
          if marker.exists():
              old=json.loads(marker.read_text())
              if old.get('telegram_message_id'):
                  print(f"Telegram already published for {pid}; skipping duplicate send")
                  raise SystemExit(0)
          body=urllib.parse.urlencode({'chat_id':os.environ['TELEGRAM_CHAT_ID'],'text':text,'disable_web_page_preview':'false'}).encode()
          req=urllib.request.Request('https://api.telegram.org/bot'+os.environ['TELEGRAM_BOT_TOKEN']+'/sendMessage',data=body,method='POST')
          with urllib.request.urlopen(req,timeout=30) as r: result=json.loads(r.read().decode())
          if not result.get('ok'): raise SystemExit('Telegram did not confirm publication')
          marker.parent.mkdir(parents=True,exist_ok=True)
          old=json.loads(marker.read_text()) if marker.exists() else {}
          old.update({'id':pid,'telegram_message_id':result['result'].get('message_id'),'status':'telegram_published'})
          marker.write_text(json.dumps(old,indent=2)+'\n')
          PY
      - name: Mark evergreen package published
        if: steps.generate.outputs.skip != 'true'
        env:
          PACKAGE: ${{ steps.generate.outputs.package }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['PACKAGE']); d=json.loads(p.read_text()); m=pathlib.Path('publish/evergreen-social-posted')/(d['id']+'.json')
          old=json.loads(m.read_text()) if m.exists() else {}
          old.update({'id':d['id'],'status':'published','article_url':d['article_url']})
          m.parent.mkdir(parents=True,exist_ok=True); m.write_text(json.dumps(old,indent=2)+'\n')
          PY
      - name: Persist package and markers
        if: steps.generate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publish/evergreen-social/ publish/evergreen-social-posted/ publish/x-posted/
          git commit -m "Evergreen Social: mark daily guide published"
          for attempt in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 3; done
          exit 1
