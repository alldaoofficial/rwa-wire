name: RWA Wire News Watch Watchdog

on:
  schedule:
    - cron: "22,52 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: rwa-wire-news-watch-watchdog
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check News Watch heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time
          from datetime import datetime, timezone, timedelta

          repo = os.environ["REPO"]

          def get_runs():
              raw = subprocess.check_output([
                  "gh", "api", "--method", "GET",
                  f"repos/{repo}/actions/workflows/news-watch.yml/runs",
                  "-f", "per_page=20"
              ], text=True)
              return json.loads(raw).get("workflow_runs", [])

          now = datetime.now(timezone.utc)
          runs = get_runs()
          recent = []
          for run in runs:
              started = run.get("run_started_at") or run.get("created_at")
              if not started:
                  continue
              dt = datetime.fromisoformat(started.replace("Z", "+00:00"))
              if now - dt <= timedelta(minutes=35):
                  recent.append(run)

          if recent:
              newest = recent[0]
              print(f"News Watch heartbeat OK: run {newest['id']} started {newest.get('run_started_at') or newest.get('created_at')}")
              raise SystemExit(0)

          print("No News Watch run detected in the last 35 minutes. Dispatching recovery run.")
          subprocess.check_call([
              "gh", "workflow", "run", "news-watch.yml", "--repo", repo, "--ref", "main"
          ])

          # Confirm that GitHub accepted and created the recovery run.
          deadline = time.time() + 60
          while time.time() < deadline:
              time.sleep(5)
              for run in get_runs():
                  event = run.get("event")
                  created = run.get("created_at")
                  if event != "workflow_dispatch" or not created:
                      continue
                  dt = datetime.fromisoformat(created.replace("Z", "+00:00"))
                  if datetime.now(timezone.utc) - dt <= timedelta(minutes=2):
                      print(f"Recovery confirmed: News Watch run {run['id']} created at {created}")
                      raise SystemExit(0)

          raise SystemExit("Recovery dispatch was requested but no News Watch run appeared within 60 seconds.")
          PY
