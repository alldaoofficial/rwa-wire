name: RWA Wire X Publisher

on:
  push:
    paths:
      - "publish/distribution/*.json"
      - "publish/market-pulse/*.json"
  workflow_dispatch:
    inputs:
      package_path:
        description: "Distribution or Market Pulse package path"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: rwa-wire-x-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Resolve package
        env:
          MANUAL_PACKAGE: ${{ inputs.package_path }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PACKAGE_PATH="$MANUAL_PACKAGE"
          else
            PACKAGE_PATH=$(git diff --name-only --diff-filter=A HEAD^ HEAD -- 'publish/distribution/*.json' 'publish/market-pulse/*.json' | head -n 1)
          fi
          if [ -z "$PACKAGE_PATH" ]; then echo "SKIP_X=true" >> "$GITHUB_ENV"; else echo "PACKAGE_PATH=$PACKAGE_PATH" >> "$GITHUB_ENV"; fi
      - name: Publish to X
        if: env.SKIP_X != 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python3 scripts/x_publish.py "$PACKAGE_PATH"
      - name: Persist X publication marker
        if: env.SKIP_X != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publish/x-posted/ publish/market-pulse-x-posted/ 2>/dev/null || true
          git commit -m "Mark RWA Wire X post published"
          for attempt in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 3; done
          exit 1
