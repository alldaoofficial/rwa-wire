name: Deploy RWA Wire to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      # Publication receipts are operational state only; they do not change the site.
      - "publish/posted/**"
      - "publish/x-posted/**"
      - "publish/market-pulse-telegram-posted/**"
      - "publish/market-pulse-x-posted/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Only the newest site state matters. Superseded queued/running deploys can stop.
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Astro site
        run: npm run build

      - name: Verify generated pages and assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          dist = Path("dist")
          pages = list(dist.rglob("*.html"))
          if not pages:
              sys.exit("No generated HTML pages found")

          missing = []
          css_links = 0
          for page in pages:
              html = page.read_text(encoding="utf-8")
              for href in re.findall(r'href=["\']([^"\']+\.css(?:\?[^"\']*)?)["\']', html):
                  css_links += 1
                  clean = href.split("?", 1)[0]
                  if clean.startswith("/"):
                      asset = dist / clean.lstrip("/")
                  else:
                      asset = page.parent / clean
                  if not asset.exists() or asset.stat().st_size == 0:
                      missing.append(f"{page}: {href}")

          if css_links == 0:
              sys.exit("No CSS references found in generated HTML")
          if missing:
              print("\n".join(missing))
              sys.exit(f"{len(missing)} generated CSS asset reference(s) are missing")

          print(f"Verified {len(pages)} HTML pages and {css_links} CSS references.")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
