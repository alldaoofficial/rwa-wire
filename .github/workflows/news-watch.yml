name: RWA Wire News Watch

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/news-watch.yml"
      - "scripts/news_watch.py"

permissions:
  contents: write
  actions: write

concurrency:
  group: rwa-wire-news-watch
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Scan RWA news
        run: python3 scripts/news_watch.py

      - name: Commit one qualified discovery
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A publish/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No qualified story."
            exit 0
          fi
          git commit -m "News Watch: add qualified RWA story"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger candidate generator
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRIEF_PATH=$(git diff-tree --no-commit-id --name-only -r HEAD -- "publish/inbox/*.json" | head -n 1)
          if [ -z "$BRIEF_PATH" ]; then
            echo "No inbox brief in News Watch commit."
            exit 1
          fi
          gh workflow run candidate-generator.yml --ref main -f brief_path="$BRIEF_PATH"
