name: RWA Wire News Watch

on:
  push:
    branches: [main]
    paths:
      - "scripts/primary_discovery.py"
      - "scripts/verified_autopublish.py"
      - ".github/workflows/news-watch.yml"
  # GitHub's scheduler remains only as a backup. The primary trigger is an
  # external scheduler calling workflow_dispatch.
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [rwa-news-watch]

permissions:
  contents: write
  actions: write

concurrency:
  group: rwa-wire-news-watch
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Report trigger
        run: echo "News Watch triggered by ${{ github.event_name }} at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Reconcile source-reviewed Telegram backlog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Reviews may finish after candidate generation. Revisit existing
          # packages even when discovery found nothing new in this run.
          git pull --ff-only origin main
          QUEUE_FILE="$RUNNER_TEMP/verified-telegram-queue.txt"
          python3 scripts/verified_autopublish.py --reconcile > "$QUEUE_FILE"
          mapfile -t APPROVED_PATHS < <(sed '/^$/d' "$QUEUE_FILE")
          if [ "${#APPROVED_PATHS[@]}" -eq 0 ]; then
            echo "No eligible unposted source-reviewed stories."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${APPROVED_PATHS[@]}"
          git diff --cached --quiet || git commit -m "Route reviewed RWA Telegram backlog"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 3
          done
          # GITHUB_TOKEN pushes do not trigger another workflow. Dispatch
          # explicitly, including unchanged approvals whose prior dispatch failed.
          for APPROVED_PATH in "${APPROVED_PATHS[@]}"; do
            gh workflow run telegram-test.yml --ref main -f manifest_path="$APPROVED_PATH"
          done

      - name: Restore News Watch state
        id: state-cache
        uses: actions/cache/restore@v4
        with:
          path: .news-watch-cache
          key: news-watch-state-${{ github.run_id }}
          restore-keys: |
            news-watch-state-

      - name: Prepare cached News Watch state
        run: |
          mkdir -p .news-watch-cache
          if [ ! -f .news-watch-cache/news-watch-state.json ]; then
            cp publish/news-watch-state.json .news-watch-cache/news-watch-state.json
          fi
          rm -f publish/news-watch-state.json
          ln -s ../.news-watch-cache/news-watch-state.json publish/news-watch-state.json

      - name: Discover direct primary-source news
        run: python3 scripts/primary_discovery.py

      - name: Scan RWA news
        run: python3 scripts/news_watch_v2.py

      - name: Confirm strong watchlist stories
        run: python3 scripts/news_watch_confirm_v2.py

      - name: Report editorial and distribution backlog
        run: python3 scripts/distribution_audit.py --summary >> "$GITHUB_STEP_SUMMARY"

      - name: Save News Watch state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .news-watch-cache
          key: news-watch-state-${{ github.run_id }}

      - name: Commit qualified discovery only
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A publish/inbox/

          BRIEF_PATH=$(git diff --cached --name-only --diff-filter=A -- 'publish/inbox/*.json' | head -n 1)
          if [ -z "$BRIEF_PATH" ]; then
            echo "story_changed=false" >> "$GITHUB_OUTPUT"
            echo "No qualified story; main remains unchanged."
            exit 0
          fi

          echo "story_changed=true" >> "$GITHUB_OUTPUT"
          echo "brief_path=$BRIEF_PATH" >> "$GITHUB_OUTPUT"
          git commit -m "News Watch: add qualified RWA story"

          # The scanner state lives behind a tracked symlink and is intentionally
          # not part of the story commit. Restore the tracked working-tree view
          # before rebasing so cached state can never block git pull --rebase.
          rm -f publish/news-watch-state.json
          git checkout -- publish/news-watch-state.json
          git status --short

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Push failed after 3 rebased attempts."
              exit 1
            fi
            echo "Remote changed during push; retrying after rebase..."
            sleep 3
          done

      - name: Trigger candidate generator
        if: steps.commit.outputs.story_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRIEF_PATH: ${{ steps.commit.outputs.brief_path }}
        run: |
          echo "Triggering candidate generator for $BRIEF_PATH"
          gh workflow run candidate-generator.yml --ref main -f brief_path="$BRIEF_PATH"
