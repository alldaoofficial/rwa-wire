name: RWA Wire Telegram Publisher

on:
  push:
    paths:
      - "publish/approved/*.json"

  workflow_dispatch:
    inputs:
      manifest_path:
        description: "Approved manifest path (publish/approved/*.json)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Load approved manifest
        env:
          MANUAL_MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MANIFEST_PATH="$MANUAL_MANIFEST_PATH"
          else
            MANIFEST_PATH=$(git diff --name-only --diff-filter=AM HEAD^ HEAD -- "publish/approved/*.json")
          fi
          COUNT=$(printf "%s\n" "$MANIFEST_PATH" | sed '/^$/d' | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "Expected exactly one newly added approval manifest, found $COUNT."
            exit 1
          fi
          echo "MANIFEST_PATH=$MANIFEST_PATH" >> "$GITHUB_ENV"
          export MANIFEST_PATH
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          p = pathlib.Path(os.environ["MANIFEST_PATH"])
          if not str(p).startswith("publish/approved/") or p.suffix != ".json":
              raise SystemExit("Invalid approval manifest path.")
          post = json.loads(p.read_text(encoding="utf-8"))
          publish_id = str(post.get("id", p.stem)).strip()
          if not publish_id or any(ch not in "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-_" for ch in publish_id):
              raise SystemExit("Invalid publish id.")
          marker = pathlib.Path("publish/posted") / (publish_id + ".json")
          if marker.exists():
              raise SystemExit("This publish id has already been posted.")
          caption = str(post["caption"]).strip()
          image_url = str(post["image_url"]).strip()
          article_url = str(post.get("article_url", "")).strip()
          if not caption or len(caption) > 1024:
              raise SystemExit("Invalid Telegram caption.")
          if not image_url.startswith("https://"):
              raise SystemExit("image_url must use HTTPS.")
          if not article_url.startswith("https://therwawire.com/news/"):
              raise SystemExit("A valid RWA Wire news article_url is required before Telegram publication.")
          req = urllib.request.Request(article_url, headers={"User-Agent": "RWA-Wire-Publisher/1.0"})
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  if response.status != 200:
                      raise SystemExit(f"Article URL returned HTTP {response.status}.")
          except Exception as exc:
              raise SystemExit(f"RWA Wire article is not live; Telegram publication blocked: {exc}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write("APPROVED_CAPTION<<RWAEOF\n" + caption + "\nRWAEOF\n")
              out.write("APPROVED_IMAGE_URL=" + image_url + "\n")
              out.write("APPROVED_PUBLISH_ID=" + publish_id + "\n")
          PY

      - name: Prepare approved distribution package
        run: python3 scripts/distribution_package.py "$MANIFEST_PATH"

      - name: Install visual renderer
        run: python3 -m pip install --quiet cairosvg

      - name: Publish approved RWA Wire post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@RWAWireHQ"
          TELEGRAM_CAPTION: ${{ env.APPROVED_CAPTION }}
          TELEGRAM_IMAGE_URL: ${{ env.APPROVED_IMAGE_URL }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          import cairosvg

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          caption = os.environ["TELEGRAM_CAPTION"].strip()
          affiliate_url = "https://www.bitunix.com/register?vipCode=0xcrlt"
          image_url = os.environ.get("TELEGRAM_IMAGE_URL", "").strip()

          # Download the editorial visual and append a fixed Bitunix partner strip.
          # Pillow is available on the GitHub-hosted runner; the supplied affiliate
          # brand asset lives in the repository so every post uses the same mark.
          from PIL import Image, ImageDraw, ImageFont
          from io import BytesIO

          with urllib.request.urlopen(image_url) as response:
              image_bytes = response.read()
          if image_url.lower().split("?")[0].endswith(".svg"):
              image_bytes = cairosvg.svg2png(bytestring=image_bytes)
          story = Image.open(BytesIO(image_bytes)).convert("RGB")

          partner_svg = pathlib.Path("public/images/partners/bitunix.svg").read_bytes()
          partner = Image.open(BytesIO(cairosvg.svg2png(bytestring=partner_svg))).convert("RGB")
          strip_h = max(120, int(story.height * 0.13))
          canvas = Image.new("RGB", (story.width, story.height + strip_h), "#080A0D")
          canvas.paste(story, (0, 0))
          draw = ImageDraw.Draw(canvas)
          draw.line((0, story.height, story.width, story.height), fill="#2ED47A", width=max(2, story.width // 500))

          pad = max(24, story.width // 30)
          label_font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", max(18, story.width // 45))
          small_font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", max(14, story.width // 65))
          draw.text((pad, story.height + strip_h * 0.28), "TRADING PARTNER", font=label_font, fill="#F5F7FA")
          draw.text((pad, story.height + strip_h * 0.62), "Affiliate partnership · Trading involves risk", font=small_font, fill="#8B949E")

          # Preserve the supplied Bitunix logo artwork and fit it into the right side.
          logo_box_w = int(story.width * 0.28)
          logo_box_h = int(strip_h * 0.72)
          partner.thumbnail((logo_box_w, logo_box_h), Image.Resampling.LANCZOS)
          x = story.width - pad - partner.width
          y = story.height + (strip_h - partner.height) // 2
          canvas.paste(partner, (x, y))
          canvas.save("telegram-branded.jpg", "JPEG", quality=92, optimize=True)

          if len(caption) > 1024:
              raise SystemExit("Caption exceeds Telegram photo-caption limit.")

          if not image_url:
              raise SystemExit("A PNG/JPG image URL is required for this publisher.")

          import uuid
          boundary = "----RWAWire" + uuid.uuid4().hex
          fields = {
              "chat_id": chat_id,
              "caption": caption,
              "reply_markup": json.dumps({"inline_keyboard": [[{"text": "◼ Trade on Bitunix ↗", "url": affiliate_url}]]})
          }
          body = bytearray()
          for key, value in fields.items():
              body.extend(f'--{boundary}\r\nContent-Disposition: form-data; name=\"{key}\"\r\n\r\n{value}\r\n'.encode())
          with open("telegram-branded.jpg", "rb") as fh:
              photo = fh.read()
          body.extend(f'--{boundary}\r\nContent-Disposition: form-data; name=\"photo\"; filename=\"rwa-wire.jpg\"\r\nContent-Type: image/jpeg\r\n\r\n'.encode())
          body.extend(photo)
          body.extend(f"\r\n--{boundary}--\r\n".encode())
          req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendPhoto", data=bytes(body), method="POST")
          req.add_header("Content-Type", f"multipart/form-data; boundary={boundary}")

          with urllib.request.urlopen(req) as response:
              result = json.loads(response.read().decode())

          if not result.get("ok"):
              raise SystemExit("Telegram API did not confirm publication.")

          print("Approved RWA Wire post published successfully.")
          PY

      - name: Mark approved post as published
        if: success()
        run: |
          mkdir -p publish/posted
          printf '{\n  "id": "%s",\n  "status": "published",\n  "source_manifest": "%s"\n}\n' "$APPROVED_PUBLISH_ID" "$MANIFEST_PATH" > "publish/posted/${APPROVED_PUBLISH_ID}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "publish/posted/${APPROVED_PUBLISH_ID}.json" "publish/distribution/${APPROVED_PUBLISH_ID}.json"
          git commit -m "Publish distribution package for ${APPROVED_PUBLISH_ID}"
          git push

