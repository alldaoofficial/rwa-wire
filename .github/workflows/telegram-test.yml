name: RWA Wire Telegram Publisher

on:
  workflow_dispatch:
    inputs:
      caption:
        description: "Telegram caption"
        required: true
        type: string
      image_url:
        description: "Public image URL"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish approved RWA Wire post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@RWAWireHQ"
          TELEGRAM_CAPTION: ${{ inputs.caption }}
          TELEGRAM_IMAGE_URL: ${{ inputs.image_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          caption = os.environ["TELEGRAM_CAPTION"]
          image_url = os.environ["TELEGRAM_IMAGE_URL"]

          if len(caption) > 1024:
              raise SystemExit("Caption exceeds Telegram photo-caption limit.")

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "photo": image_url,
              "caption": caption,
          }).encode()

          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendPhoto",
              data=data,
              method="POST",
          )

          with urllib.request.urlopen(req) as response:
              result = json.loads(response.read().decode())

          if not result.get("ok"):
              raise SystemExit("Telegram API did not confirm publication.")

          print("Approved RWA Wire post published successfully.")
          PY
