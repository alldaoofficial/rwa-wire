name: Update RWA Market Data
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and validate RWA data
        run: python scripts/update_rwa_market.py
      - name: Commit changed snapshot
        run: |
          if git diff --quiet src/data/rwa-market.json; then
            echo "No market-data changes."
            exit 0
          fi
          git config user.name "rwa-wire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/rwa-market.json
          git commit -m "chore: refresh RWA market snapshot"
          git pull --rebase origin main
          git push origin main
