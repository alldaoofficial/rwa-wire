name: RWA Wire Market Pulse

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9,18 * * *'

permissions:
  contents: write

concurrency:
  group: rwa-wire-market-pulse
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Refresh shared market cache
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python3 scripts/update_market_data.py
      - name: Generate Market Pulse
        run: python3 scripts/market_pulse.py
      - name: Resolve generated package
        run: |
          PULSE_PATH=$(ls -t publish/market-pulse/*.json | head -n 1)
          echo "PULSE_PATH=$PULSE_PATH" >> "$GITHUB_ENV"
      - name: Prepare Telegram package
        run: |
          python3 - "$PULSE_PATH" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text()); text=str(d['telegram']).strip()
          if not text or len(text)>4096: raise SystemExit('Invalid Telegram Market Pulse')
          out=pathlib.Path('publish/market-pulse-telegram-ready'); out.mkdir(parents=True,exist_ok=True)
          (out/(p.stem+'.json')).write_text(json.dumps({'id':p.stem,'chat_id':'@RWAWireHQ','text':text},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Persist Market Pulse package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/markets.json publish/market-pulse/ publish/market-pulse-telegram-ready/
          git commit -m "Market Pulse: add production snapshot"
          for attempt in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 3; done
          exit 1
      - name: Publish Market Pulse to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@RWAWireHQ"
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          p=pathlib.Path(os.environ['PULSE_PATH']); d=json.loads(p.read_text(encoding='utf-8')); pid=p.stem; text=str(d['telegram']).strip()
          from scripts.social_links import social_copy
          text=social_copy(text,'https://therwawire.com/markets/','telegram',pid,4096)
          marker=pathlib.Path('publish/market-pulse-telegram-posted')/(pid+'.json')
          if marker.exists(): raise SystemExit('Market Pulse already posted to Telegram')
          if not text or len(text)>4096: raise SystemExit('Invalid Telegram Market Pulse')
          body=urllib.parse.urlencode({'chat_id':os.environ['TELEGRAM_CHAT_ID'],'text':text,'disable_web_page_preview':'true'}).encode()
          req=urllib.request.Request('https://api.telegram.org/bot'+os.environ['TELEGRAM_BOT_TOKEN']+'/sendMessage',data=body,method='POST')
          with urllib.request.urlopen(req,timeout=30) as r: result=json.loads(r.read().decode())
          if not result.get('ok'): raise SystemExit('Telegram API did not confirm Market Pulse publication')
          marker.parent.mkdir(parents=True,exist_ok=True); marker.write_text(json.dumps({'id':pid,'status':'published','message_id':(result.get('result') or {}).get('message_id')},indent=2)+'\n')
          PY
      - name: Publish Market Pulse to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python3 scripts/x_publish.py "$PULSE_PATH"
      - name: Persist publication markers
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for dir in publish/market-pulse-telegram-posted/ publish/market-pulse-x-posted/; do if [ -d "$dir" ]; then git add "$dir"; fi; done
          git diff --cached --quiet && exit 0
          git commit -m "Record completed Market Pulse publications"
          for attempt in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 3; done
          exit 1

# Scheduled/dispatch runs publish directly because commits created with the
# workflow GITHUB_TOKEN do not trigger additional push workflows. Duplicate
# markers still protect Telegram and X against repeat publication.
