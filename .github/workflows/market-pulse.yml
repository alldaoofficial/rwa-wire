name: RWA Wire Market Pulse

on:
  workflow_dispatch:
  schedule:
    # 09:00 / 18:00 UTC = 11:00 / 20:00 CEST.
    - cron: '0 9,18 * * *'

permissions:
  contents: write

concurrency:
  group: rwa-wire-market-pulse
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      pulse_path: ${{ steps.paths.outputs.pulse_path }}
      telegram_path: ${{ steps.paths.outputs.telegram_path }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Refresh shared market cache
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python3 scripts/update_market_data.py
      - name: Generate Market Pulse
        run: python3 scripts/market_pulse.py
      - name: Prepare Telegram package and paths
        id: paths
        env:
          TELEGRAM_CHAT_ID: "@RWAWireHQ"
        run: |
          PULSE_PATH=$(ls -t publish/market-pulse/*.json | head -n 1)
          python3 - "$PULSE_PATH" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text()); text=str(d['telegram']).strip()
          if not text or len(text)>4096: raise SystemExit('Invalid Telegram Market Pulse')
          out=pathlib.Path('publish/market-pulse-telegram-ready'); out.mkdir(parents=True,exist_ok=True)
          (out/(p.stem+'.json')).write_text(json.dumps({'id':p.stem,'chat_id':'@RWAWireHQ','text':text},ensure_ascii=False,indent=2)+'\n')
          PY
          TELEGRAM_PATH="publish/market-pulse-telegram-ready/$(basename "$PULSE_PATH")"
          echo "pulse_path=$PULSE_PATH" >> "$GITHUB_OUTPUT"
          echo "telegram_path=$TELEGRAM_PATH" >> "$GITHUB_OUTPUT"
      - name: Persist Market Pulse snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/markets.json publish/market-pulse/ publish/market-pulse-telegram-ready/
          git commit -m "Market Pulse: add production snapshot"
          for attempt in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 3; done
          exit 1

  telegram:
    needs: generate
    uses: ./.github/workflows/telegram-test.yml
    with:
      manifest_path: ${{ needs.generate.outputs.telegram_path }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

  x:
    needs: generate
    uses: ./.github/workflows/x-publisher.yml
    with:
      package_path: ${{ needs.generate.outputs.pulse_path }}
    secrets:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
