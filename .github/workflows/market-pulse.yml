name: RWA Wire Market Pulse

on:
  workflow_dispatch:
  schedule:
    # 09:00 / 18:00 UTC = 11:00 / 20:00 CEST.
    - cron: '0 9,18 * * *'

permissions:
  contents: write

concurrency:
  group: rwa-wire-market-pulse
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Refresh shared market cache
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python3 scripts/update_market_data.py

      - name: Generate Market Pulse
        run: python3 scripts/market_pulse.py

      - name: Persist Market Pulse snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/markets.json publish/market-pulse/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Market Pulse: add snapshot"
          git pull --rebase origin main
          git push
